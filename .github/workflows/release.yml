name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          MEGA_KEYSTORE_BASE64: ${{ secrets.MEGA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MEGA_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto MEGA_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$MEGA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mi_firma.keystore"
          chmod 600 "$RUNNER_TEMP/mi_firma.keystore"

      - name: Build release APKs
        env:
          MEGA_KEYSTORE_FILE: ${{ runner.temp }}/mi_firma.keystore
          MEGA_KEYSTORE_PASSWORD: ${{ secrets.MEGA_KEYSTORE_PASSWORD }}
          MEGA_KEY_ALIAS: ${{ secrets.MEGA_KEY_ALIAS }}
          MEGA_KEY_PASSWORD: ${{ secrets.MEGA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Read version and validate tag
        id: version
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' version.properties | tr -d '[:space:]')
          VERSION_CODE=$(sed -n 's/^VERSION_CODE=//p' version.properties | tr -d '[:space:]')
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::No se pudo leer version.properties"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "$TAG" != "v${VERSION_NAME}" ]; then
              echo "::error::El tag $TAG no coincide con VERSION_NAME=$VERSION_NAME"
              exit 1
            fi
          else
            TAG="v${VERSION_NAME}"
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Versión $VERSION_NAME ($VERSION_CODE), tag $TAG"

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          VERSION="${{ steps.version.outputs.name }}"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            "release-assets/mega-equalizer-${VERSION}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk \
            "release-assets/mega-equalizer-${VERSION}-armeabi-v7a.apk"
          cp app/build/outputs/apk/release/app-universal-release.apk \
            "release-assets/mega-equalizer-${VERSION}-universal.apk"
          ls -lh release-assets

      - name: Generate version.json
        run: |
          python3 scripts/make-release-metadata.py \
            --apk-dir release-assets \
            --output release-assets/version.json \
            --version-name "${{ steps.version.outputs.name }}" \
            --version-code "${{ steps.version.outputs.code }}" \
            --tag "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --notes-file RELEASE_NOTES.md

      - name: Show checksums
        run: sha256sum release-assets/*

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mega-equalizer-${{ steps.version.outputs.name }}
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Mega Equalizer ${{ steps.version.outputs.name }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
